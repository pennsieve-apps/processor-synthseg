# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
schemaVersion: "1.0"
application:
  name: SynthSeg Brain Segmentation
  description: >-
    Whole-brain segmentation of T1-weighted MRI with SynthSeg 2.0 (Billot et al.,
    Medical Image Analysis 2023; robust/parcellation/QC variants from Billot et al.,
    PNAS 2023), run on the CPU through FreeSurfer's mri_synthseg script. Takes one
    T1w NIfTI per subject and writes a FreeSurfer-labelled segmentation
    (labels/<sub>_dseg.nii.gz), a per-subject volume table (volumes/<sub>_volumes.csv,
    mm3, plus a cohort table volumes/volumes.csv) and automated QC scores
    (qc/<sub>_qc.csv). Works on scans of any contrast and resolution; the label map
    is always at 1 mm isotropic.
  type: processor
  tags: [neuroimaging, mri, nifti, synthseg, segmentation, freesurfer]
runtime:
  cpu: 4096
  # SynthSeg's 3D U-Net holds the whole 1 mm volume in memory: measured ~6 GB at a 160^3
  # patch and >7.3 GB at 192^3; a 192x256x256 whole-head scan extrapolates to ~14-19 GB,
  # so 16 GB is not enough for whole-image segmentation (set CROP=192 if memory is cut).
  memory: 30720
  computeTypes: [standard]
  timeoutSeconds: 3600
parameters:
  - name: ROBUST
    type: boolean
    description: >-
      Use SynthSeg-robust (--robust): slower, but meant for clinical or low-quality
      scans (thick slices, low SNR, poor tissue contrast). Implies SynthSeg's fast
      mode (no test-time flipping / topology clean-up).
    defaultValue: false
  - name: PARC
    type: boolean
    description: >-
      Also parcellate the cortex (--parc): the label map gets Desikan-Killiany
      cortical labels (1000-1035 left, 2000-2035 right) and the volume table gets
      one column per cortical region.
    defaultValue: false
  - name: THREADS
    type: integer
    description: Number of CPU threads TensorFlow may use (--threads).
    defaultValue: 4
  - name: CROP
    type: integer
    description: >-
      0 (default): segment the whole image (minus any all-zero margin). Otherwise only a
      centred patch of CROP x CROP x CROP voxels at 1 mm is segmented (--crop; rounded up
      to a multiple of 32), which bounds memory and time on large fields of view; 192
      covers an adult brain when the head is roughly centred. Everything outside the
      patch is labelled background.
    defaultValue: 0
inputs:
  - name: image
    description: >-
      One T1-weighted scan per subject, named <subject>[_<entities>]_T1w.nii.gz
      (e.g. sub-01_T1w.nii.gz or sub-01_desc-n4_T1w.nii.gz). Found in INPUT_DIR/image/
      when linked, else anywhere under INPUT_DIR by its T1w suffix.
    mediaTypes: [application/x-nifti-gz, application/x-nifti]
    required: true
outputs:
  - name: labels
    description: >-
      labels/<sub>_dseg.nii.gz: whole-brain segmentation at 1 mm isotropic with
      FreeSurfer label values (int32), plus provenance.json.
    mediaTypes: [application/x-nifti-gz, application/json]
  - name: volumes
    description: >-
      volumes/<sub>_volumes.csv: SynthSeg's --vol table for one subject (header row +
      one row; mm3; first columns subject, total intracranial, then one per
      structure). volumes/volumes.csv: the same for every subject of the run, one
      row per subject.
    mediaTypes: [text/csv]
  - name: qc
    description: >-
      qc/<sub>_qc.csv: SynthSeg's --qc table (predicted Dice-like quality score in
      [0, 1] per structure group; values under ~0.65 flag a likely failed region).
    mediaTypes: [text/csv]
